name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: No statements or personal identifiers in the repo
        run: npm run check:repo

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Built files reference nothing external
        run: npm run check:dist

      - name: Install the test browser
        run: npx playwright-core install --with-deps chromium

      - name: Privacy test (no network requests after load)
        run: npm run test:e2e
